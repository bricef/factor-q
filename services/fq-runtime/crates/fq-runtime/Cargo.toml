[package]
name = "fq-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
# The agent definition domain (model, parser, registry) is its own
# crate: the operator client validates a definition without linking any
# of this. Re-exported from `crate::agent`, so nothing here moved path.
fq-agent = { workspace = true }
fq-ops = { workspace = true }
fq-tools = { workspace = true }
async-nats = { workspace = true }
# Optional: only the `test-support` feature (the mock LLM server for
# sibling crates' integration tests) compiles it into a non-test build.
axum = { workspace = true, optional = true }
url = "2"
# Trimmed from "full" (#194 phase 2): this is a library crate, so its
# feature set leaks to every consumer. The list is the observed need of
# the daemon loops (spawn/select/timers/channels), the SQLite projection
# and config IO, and the MCP child-process transport; the dev-dependency
# below re-adds "full" for test builds. Binaries (fq-cli, fq-dashboard)
# take "full" themselves.
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
schemars = { workspace = true }
serde = { workspace = true }
# Reports the keys a parse silently dropped, which `deny_unknown_fields`
# cannot: `ProvidersConfig` uses `#[serde(flatten)]`, and serde rejects
# the two together.
serde_ignored = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
bytes = "1"
getrandom = "0.3"
toml = { workspace = true }
async-trait = { workspace = true }
genai = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1.7", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
strum = { workspace = true }

[features]
# Expose test_support::mock_anthropic to other crates' dev-dependencies
# (resolver 2 keeps this out of every non-test build of consumers).
test-support = ["dep:axum"]

[dev-dependencies]
# The shared private-broker guard, re-exported as `test_support::nats` for
# this crate's `#[cfg(test)]` code and used directly by tests/*.rs (#233).
fq-test-support = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }
# Test builds get the whole runtime back — the trim above is about what
# consumers inherit, not about starving the test suite.
tokio = { workspace = true, features = ["full"] }
# Integration tests construct rmcp wire types (e.g. a canned
# `CreateMessageResult` to reply to a bridged sampling request); the
# `server` + `transport-async-rw` features let unit tests serve an
# in-process mock MCP server over a duplex (D1: pagination / mutation).
rmcp = { version = "1.7", default-features = false, features = ["client", "server", "transport-child-process", "transport-async-rw"] }

[lints]
workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
