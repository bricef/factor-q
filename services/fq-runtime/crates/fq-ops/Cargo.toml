[package]
name = "fq-ops"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

# The operation-registry contract crate (ADR-0006) and the sqlx-free
# wire crate ADR-0031 calls for. A LEAF by design: no sqlx, no NATS,
# no tokio, no tarpc — `fq` the thin client will depend on this crate
# alone, so anything heavier added here leaks into the client binary.
# tests/forbidden_dependency_gate.rs enforces the list.

[dependencies]
# A reducer state blob goes on the wire as base64 text (#981): see
# `events/payloads/state_blob.rs`. Declared here, not in the workspace
# table, because fq-ops is its only member user. Already in the thin
# client's tree at this version (through `rcgen`'s `pem`) with these
# features, so linking it adds nothing to `fq`; no default features,
# which would add the unsafe SIMD path.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Timestamps on the wire (events and the DeadLetter atom) and the
# `since` grammar's parsing. `serde` because a shape here is one both
# ends (de)serialise; `clock` comes with the workspace default and is
# used — `Event::new`/`Event::system` stamp the envelope with
# `Utc::now()` (events.rs).
chrono = { workspace = true, features = ["serde"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
# Only for `canonical_json` in the snapshot oracle. This crate depends on
# serde_json and tokio alone, so it cannot pull `genai` — and therefore
# `serde_json/preserve_order` — into fq-ops' own test build.
fq-test-support = { workspace = true }
proptest = { workspace = true }
