# factor-q daemon configuration — read by `fqd`, and by nothing else.
#
# The client, `fq`, reads the file beside this one: `fq.toml`. One
# config per binary, named for it, so neither has to know the other's
# shape — and so an operator on another machine, who runs no daemon and
# has no fqd.toml, still has a client that works.
#
# All fields have sensible defaults — delete any section below if you
# want to accept the default. Secrets are never stored in this file;
# instead, each provider names an environment variable that holds its
# key.
#
# Full documentation: https://github.com/bricef/factor-q

# Daemon default cap on LLM turns per invocation — a backstop against a
# wedged agent, well below the host step budget. An agent definition may
# override this with its own `max_iterations:` in frontmatter, applied on
# `fq reload` with no restart. When neither is set, a built-in default
# (100) applies. Raise it for workloads that legitimately need more
# turns; lower it to fail runaway agents sooner.
# max_iterations = 100

[nats]
# URL of the NATS server, host and port only. JetStream must be enabled
# on the server.
url = "nats://localhost:4222"
#
# The broker's token comes from the environment, never from this file:
# name the variable here and export it before starting fqd. The
# scaffolded docker-compose.yml starts NATS with the development token
# `fq-dev-token`, so for that broker:
#
#   export FQ_NATS_TOKEN=fq-dev-token
#
# A URL with a credential in it (`nats://TOKEN@host`) is refused at
# startup: the URL is printed in the banner, the log and the
# `system.startup` event, and a secret must never be. Change the token
# in the compose file and the exported variable together for any
# deployment that leaves this machine.
token_env = "FQ_NATS_TOKEN"

[agents]
# Directory containing agent definition files (.md with YAML frontmatter).
# Relative paths are resolved against this config file's directory.
directory = "agents"
#
# Fallback model for definitions that omit `model:` in their frontmatter.
# When set, an agent with no explicit model inherits this; when unset,
# every agent must name its own model. Must itself be a declared, priced
# model (see the pricing guarantee under [providers.anthropic]).
# default_model = "claude-haiku-4-5"

# [workspace]
# Per-invocation workspace binding. Agents reference their working
# directory as `${workspace}` (in sandbox.exec_cwd/fs_read/fs_write and
# in tool parameters); this section says what the token binds to. When
# the section is omitted the token is unbound, and any agent that uses
# it fails loudly at invocation start.
#
# The runtime only provisions *directories* — what goes into a
# workspace (cloning an upstream repo, branching, pushing) is the
# agent's job through its granted tools.
#
# The workspace path. With `per_invocation = false` this directory
# itself is the binding, shared by every invocation; with
# `per_invocation = true` it is the root under which each invocation
# gets a fresh empty directory named by its invocation id.
# path = "/path/to/workspace"
#
# Provision a fresh empty directory per invocation (#14/#70). Default
# off. A suspended invocation keeps its directory across restarts;
# terminal invocations are reclaimed, and orphans are swept at daemon
# startup.
# per_invocation = false

[cache]
# Directory for runtime cache files (LiteLLM pricing JSON, etc).
# If omitted, defaults to $XDG_CACHE_HOME/factor-q, then
# $HOME/.cache/factor-q, then the system temp directory.
# directory = "./cache"

[state]
# Directory for data factor-q must never regenerate — today the edge
# identity: the daemon's self-signed certificate and its biscuit token
# root. Losing it orphans every client pinned to the old fingerprint
# and invalidates every token already issued, so this is deliberately
# NOT the cache directory, which the XDG spec and FHS 5.5 both license
# a cleaner to empty at any time.
#
# If omitted, defaults to $XDG_STATE_HOME/factor-q, then
# $HOME/.local/state/factor-q, then /var/lib/factor-q.
#
# An upgrade from a build that kept the identity under [cache] adopts
# it on first start (and says so) rather than minting a new one.
# directory = "./state"
#
# The rest of this section is retention: how long the sweepable parts
# of that state are kept. Two independent windows, because they bound
# different things — the record of work that finished, and the roster
# of daemons that died.
#
# How long archived invocations and projected event rows are kept, in
# days. Default 30. Cost-bearing rows are exempt and kept indefinitely,
# so spend never silently windows out from under a `fq costs`. Set to
# `-1` to disable the sweep entirely (the archive then grows without
# bound; useful if you would rather manage retention with an external
# job).
# retention_days = 30
#
# How long a worker registration that has ALREADY gone stale is kept,
# in days. Default 7. This is not the stale *threshold* — a worker is
# marked stale after roughly 30s of missed heartbeats — it is how long
# the evidence of the death outlives it, which is why it is measured in
# days: a Friday-night failure is still on the roster on Monday. Set to
# `-1` to keep stale registrations indefinitely.
# stale_worker_retention_days = 7
#
# How often the retention sweep runs, in seconds. Default 1 hour,
# shared by both windows above. Production doesn't need faster: the
# deletes are proportional to the number of rows past the cutoff each
# tick, so a shorter interval just means smaller per-tick batches.
# sweep_interval_seconds = 3600

[providers.anthropic]
# Environment variable holding the Anthropic API key. The runtime reads
# the variable at call time; nothing is written back to this file.
api_key_env = "ANTHROPIC_API_KEY"
#
# The model registry (ADR-0003/0004): list every model an agent may use.
# An agent whose `model:` names an id not declared under some provider
# fails to load, and the daemon refuses to start unless every declared
# model is priced (below). This makes the models the fleet can spend on
# explicit in one place — a config typo can't silently run an expensive
# model, and an unpriced model can't silently defeat budget enforcement.
models = ["claude-haiku-4-5"]
#
# Optional override for the Anthropic API base URL. When unset, the
# runtime uses Anthropic's public endpoint. Use cases: pointing at a
# local mock during integration tests, an internal LLM proxy, or a
# Bedrock-compatible endpoint.
# base_url = "http://127.0.0.1:8080"

# --- Additional providers (optional) --------------------------------------
# Any OpenAI-compatible provider (OpenRouter, Groq, Together, a local
# vLLM, …) is available by configuration alone — no code. Declare its
# shape, endpoint, key env var, and the model ids it serves. Agents then
# select one of its models via their `model:` frontmatter.
#
# [providers.openrouter]
# api_shape   = "openai-compatible"   # anthropic | openai | gemini | ollama | openai-compatible
# base_url    = "https://openrouter.ai/api/v1"
# api_key_env = "OPENROUTER_API_KEY"
# models      = ["openai/gpt-4o-mini"]
#
# Per-model price override, USD per MILLION tokens. Required for any model
# the LiteLLM pricing table doesn't list (e.g. OpenRouter-namespaced ids)
# — without it the daemon refuses to start, since an unpriced model would
# track its cost as $0 and silently escape budget enforcement (ADR-0004).
# [providers.openrouter.pricing."openai/gpt-4o-mini"]
# input_per_mtok  = 0.15
# output_per_mtok = 0.60
# # optional: cache_read_per_mtok, cache_write_per_mtok (default: input rate)

[worker]
# How many invocations one daemon runs concurrently (#70). Default 1
# (serial). Raise only once ALL of the following hold:
#   - per-invocation workspaces are enabled ([workspace]
#     per_invocation = true) so concurrent invocations cannot clobber
#     each other's files — the daemon refuses to start otherwise;
#   - the parallel-workers Phase-2 verification gate is green
#     (concurrent recovery/drain/shutdown, and the shared base-MCP
#     connection proven safe under concurrent reads — see
#     docs/plans/active/2026-07-10-parallel-workers-worktree.md);
#   - you accept the spend profile: each in-flight invocation spends
#     budget in parallel, and this bound only gates dispatcher-run
#     invocations (startup recovery resumes all recoverable invocations
#     concurrently regardless); a fleet-level cost cap is #42.
# max_concurrent_invocations = 1
#
# Deadlines on every model call (#546). Without them a provider that
# accepts the connection and never answers parks the invocation — and,
# at max_concurrent_invocations = 1, the daemon — until a restart.
#
# The whole call, connect to last byte, in seconds. Default 600 (ten
# minutes): what the Anthropic and OpenAI SDKs default to, and enough
# for a large extended-thinking answer, which a shorter budget would cut
# off after the provider has billed it. A call past the deadline fails
# as a transient `timeout` that the retry policy below retries, so a
# provider that never answers holds a worker for at most
# llm_retry.max_attempts times this. Trim it for fast models.
# llm_timeout_secs = 600
#
# Establishing the connection, in seconds. An endpoint that never
# answers fails here rather than after the whole budget. Default 5.
# llm_connect_timeout_secs = 5
#
# Worker-side knobs for the archive hand-off retry sweeper. The
# sweeper republishes `invocation.archived` for any terminal row
# whose control-plane ack hasn't arrived yet.
#
# How often the sweeper republishes pending rows, in ms. Lower
# values shorten time-to-recovery after a control-plane restart
# at the cost of more NATS traffic during sustained outages.
# archive_retry_interval_ms = 10000
#
# How long after `terminal_at` (in ms) the sweeper logs one
# warning per held row. The sweeper *keeps republishing* past
# this point — the warn is the operator-visible signal that the
# control-plane isn't acknowledging in a reasonable time. The
# local row is never deleted automatically (correctness over
# cleanup); operator action is required for held rows.
# archive_warn_after_ms = 60000

# Retry policy for transient model-call failures: a 429, a 5xx, a
# connection failure, a timeout. Retrying is safe — a model call has no
# side effect — and a retry does not consume an iteration. A 4xx other
# than 429 is never retried: the provider has rejected the request, and
# the same bytes would be rejected again.
[worker.llm_retry]
# Total attempts including the first; 1 disables retry. Default 4.
# max_attempts = 4
#
# Delay before the first retry, in ms, doubling each attempt, with full
# jitter so a fleet does not retry in lockstep. Default 500.
# base_delay_ms = 500
#
# Cap on any single backoff delay, in ms. Default 30000.
# max_delay_ms = 30000
#
# The longest `Retry-After` a rate-limited call is waited out in place,
# in ms. A 429 that names a shorter wait is retried after at least that
# long (plus the jitter above); one that asks for more fails at once as
# rate-limited, still naming the wait, so the invocation can be deferred
# rather than a worker parked (#278). Default 120000.
# max_retry_after_ms = 120000

[tools.exec]
# Timeouts for the built-in `exec` tool. Raise these for agents that run
# long builds/test suites (e.g. a full `just ci`); a call that exceeds
# the timeout is killed and returned as an error with partial output.
#
# Timeout applied when a call doesn't set its own `timeout_secs`. Default 120.
# default_timeout_secs = 120
#
# Hard ceiling on any single call. A caller-supplied `timeout_secs` above
# this is clamped down (not rejected). Default 600.
# max_timeout_secs = 600

[edge]
# The authenticated operator surface — every `fq` verb speaks it, so a
# daemon without one can be neither inspected nor stopped except by a
# signal. There is no way to switch it off, and the bound listener
# doubles as the daemon's single-instance lock: it is taken before
# anything else happens, so a second daemon on the same address exits at
# once, naming it, having registered no worker and published nothing.
#
# Bind address for the TLS listener. Default 127.0.0.1:9472. Note the
# dashboard's own default is the same port — move one of them if you run
# both on one host.
# bind = "127.0.0.1:9472"
#
# How long a `min_seq`-gated read waits for the projection to catch up
# before answering `Lagging`, in ms. Default 2000.
# min_seq_wait_ms = 2000
#
# The connection budget. These bound what a peer that has not
# authenticated can make the daemon allocate — an fd and a task per
# connection, a rustls session per handshake — and what one client that
# has can queue. Raise them for a busy dashboard or many operators;
# there is rarely a reason to lower them.
#
# Connections held at once, authenticated or not. Past this the accept
# loop stops taking sockets off the backlog. Default 256.
# max_connections = 256
#
# Connections in the pre-auth phase (TLS handshake + token read).
# Tighter than max_connections because a handshake costs CPU where an
# open connection costs a descriptor. Default 64.
# max_pre_auth_connections = 64
#
# In-flight requests per authenticated connection. Default 32.
# max_concurrent_requests = 32
#
# How long the accept loop pauses after a failed `accept`, in ms. Not a
# nicety: tokio does not clear a listener's readiness on EMFILE, so
# retrying immediately would spin a worker thread and starve the very
# tasks holding the descriptors. Default 100.
# accept_error_backoff_ms = 100
