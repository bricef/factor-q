# factor-q daemon configuration — read by `fqd`, and by nothing else.
#
# The client, `fq`, reads the file beside this one: `fq.toml`. One
# config per binary, named for it, so neither has to know the other's
# shape — and so an operator on another machine, who runs no daemon and
# has no fqd.toml, still has a client that works.
#
# All fields have sensible defaults — delete any section below if you
# want to accept the default. Secrets are never stored in this file;
# instead, each provider names an environment variable that holds its
# key.
#
# Full documentation: https://github.com/bricef/factor-q

# Daemon default cap on LLM turns per invocation — a backstop against a
# wedged agent, well below the host step budget. An agent definition may
# override this with its own `max_iterations:` in frontmatter, applied on
# `fq reload` with no restart. When neither is set, a built-in default
# (100) applies. Raise it for workloads that legitimately need more
# turns; lower it to fail runaway agents sooner.
# max_iterations = 100

[nats]
# URL of the NATS server, host and port only. JetStream must be enabled
# on the server.
url = "nats://localhost:4222"
#
# The broker's token comes from the environment, never from this file:
# name the variable here and export it before starting fqd. The
# scaffolded docker-compose.yml starts NATS with the development token
# `fq-dev-token`, so for that broker:
#
#   export FQ_NATS_TOKEN=fq-dev-token
#
# A URL with a credential in it (`nats://TOKEN@host`) is refused at
# startup: the URL is printed in the banner, the log and the
# `system.startup` event, and a secret must never be. Change the token
# in the compose file and the exported variable together for any
# deployment that leaves this machine.
token_env = "FQ_NATS_TOKEN"

[agents]
# Directory containing agent definition files (.md with YAML frontmatter).
# Relative paths are resolved against this config file's directory.
directory = "agents"
#
# Fallback model for definitions that omit `model:` in their frontmatter.
# When set, an agent with no explicit model inherits this; when unset,
# every agent must name its own model. Must itself be a declared, priced
# model (see the pricing guarantee under [providers.anthropic]).
# default_model = "claude-haiku-4-5"

# [workspace]
# Per-invocation workspace binding. Agents reference their working
# directory as `${workspace}` (in sandbox.exec_cwd/fs_read/fs_write and
# in tool parameters); this section says what the token binds to. When
# the section is omitted the token is unbound, and any agent that uses
# it fails loudly at invocation start.
#
# The runtime only provisions *directories* — what goes into a
# workspace (cloning an upstream repo, branching, pushing) is the
# agent's job through its granted tools.
#
# The workspace path. With `per_invocation = false` this directory
# itself is the binding, shared by every invocation; with
# `per_invocation = true` it is the root under which each invocation
# gets a fresh empty directory named by its invocation id.
# path = "/path/to/workspace"
#
# Provision a fresh empty directory per invocation (#14/#70). Default
# off. A suspended invocation keeps its directory across restarts;
# terminal invocations are reclaimed, and orphans are swept at daemon
# startup.
# per_invocation = false

[cache]
# Directory for runtime cache files (LiteLLM pricing JSON, etc).
# If omitted, defaults to $XDG_CACHE_HOME/factor-q, then
# $HOME/.cache/factor-q, then the system temp directory.
# directory = "./cache"

[state]
# Directory for data factor-q must never regenerate — today the edge
# identity: the daemon's self-signed certificate and its biscuit token
# root. Losing it orphans every client pinned to the old fingerprint
# and invalidates every token already issued, so this is deliberately
# NOT the cache directory, which the XDG spec and FHS 5.5 both license
# a cleaner to empty at any time.
#
# If omitted, defaults to $XDG_STATE_HOME/factor-q, then
# $HOME/.local/state/factor-q, then /var/lib/factor-q.
#
# An upgrade from a build that kept the identity under [cache] adopts
# it on first start (and says so) rather than minting a new one.
# directory = "./state"
#
# The rest of this section is retention: how long the sweepable parts
# of that state are kept. Two independent windows, because they bound
# different things — the record of work that finished, and the roster
# of daemons that died.
#
# How long archived invocations and projected event rows are kept, in
# days. Default 30. Cost-bearing rows are exempt and kept indefinitely,
# so spend never silently windows out from under a `fq costs`. Set to
# `-1` to disable the sweep entirely (the archive then grows without
# bound; useful if you would rather manage retention with an external
# job).
# retention_days = 30
#
# How long a worker registration that has ALREADY gone stale is kept,
# in days. Default 7. This is not the stale *threshold* — a worker is
# marked stale after roughly 30s of missed heartbeats — it is how long
# the evidence of the death outlives it, which is why it is measured in
# days: a Friday-night failure is still on the roster on Monday. Set to
# `-1` to keep stale registrations indefinitely.
# stale_worker_retention_days = 7
#
# How often the retention sweep runs, in seconds. Default 1 hour,
# shared by both windows above. Production doesn't need faster: the
# deletes are proportional to the number of rows past the cutoff each
# tick, so a shorter interval just means smaller per-tick batches.
# sweep_interval_seconds = 3600

[providers.anthropic]
# Environment variable holding the Anthropic API key. The runtime reads
# the variable at call time; nothing is written back to this file.
api_key_env = "ANTHROPIC_API_KEY"
#
# The model registry (ADR-0003/0004): list every model an agent may use.
# An agent whose `model:` names an id not declared under some provider
# fails to load, and the daemon refuses to start unless every declared
# model is priced (below). This makes the models the fleet can spend on
# explicit in one place — a config typo can't silently run an expensive
# model, and an unpriced model can't silently defeat budget enforcement.
models = ["claude-haiku-4-5"]
#
# Optional override for the Anthropic API base URL. When unset, the
# runtime uses Anthropic's public endpoint. Use cases: pointing at a
# local mock during integration tests, an internal LLM proxy, or a
# Bedrock-compatible endpoint.
# base_url = "http://127.0.0.1:8080"

# --- Additional providers (optional) --------------------------------------
# Any OpenAI-compatible provider (OpenRouter, Groq, Together, a local
# vLLM, …) is available by configuration alone — no code. Declare its
# shape, endpoint, key env var, and the model ids it serves. Agents then
# select one of its models via their `model:` frontmatter.
#
# [providers.openrouter]
# api_shape   = "openai-compatible"   # anthropic | openai | gemini | ollama | openai-compatible
# base_url    = "https://openrouter.ai/api/v1"
# api_key_env = "OPENROUTER_API_KEY"
# models      = ["openai/gpt-4o-mini"]
#
# Models declared under a provider whose base_url is openrouter.ai are
# priced from OpenRouter's own catalogue (GET {base_url}/models, fetched
# at startup and cached beside the LiteLLM snapshot), under exactly the
# ids listed above — no override needed. Every other provider's models
# are priced from the LiteLLM table.
#
# Per-model price override, USD per MILLION tokens. Required for any model
# neither source lists (a custom endpoint, a model too new for either) —
# without it the daemon refuses to start, since an unpriced model would
# track its cost as $0 and silently escape budget enforcement (ADR-0004).
# An override always wins over both sources.
# [providers.openrouter.pricing."openai/gpt-4o-mini"]
# input_per_mtok  = 0.15
# output_per_mtok = 0.60
# # optional: cache_read_per_mtok, cache_write_per_mtok (default: input rate)

[worker]
# How many invocations one daemon runs concurrently (#70). Default 1
# (serial). Raise only once ALL of the following hold:
#   - per-invocation workspaces are enabled ([workspace]
#     per_invocation = true) so concurrent invocations cannot clobber
#     each other's files — the daemon refuses to start otherwise;
#   - the parallel-workers Phase-2 verification gate is green
#     (concurrent recovery/drain/shutdown, and the shared base-MCP
#     connection proven safe under concurrent reads — see
#     docs/plans/active/2026-07-10-parallel-workers-worktree.md);
#   - you accept the spend profile: each in-flight invocation spends
#     budget in parallel, and this bound only gates dispatcher-run
#     invocations (startup recovery resumes all recoverable invocations
#     concurrently regardless); a fleet-level cost cap is #42.
# max_concurrent_invocations = 1
#
# Deadlines on every model call (#546). Without them a provider that
# accepts the connection and never answers parks the invocation — and,
# at max_concurrent_invocations = 1, the daemon — until a restart.
#
# The whole call, connect to last byte, in seconds. Default 600 (ten
# minutes): what the Anthropic and OpenAI SDKs default to, and enough
# for a large extended-thinking answer, which a shorter budget would cut
# off after the provider has billed it. A call past the deadline fails
# as a transient `timeout` that the retry policy below retries under its
# own cap, so a provider that never answers holds a worker for at most
# llm_retry.timeout_max_attempts (default 2) times this — twenty minutes
# at the defaults. Trim it for fast models.
# llm_timeout_secs = 600
#
# Establishing the connection, in seconds. An endpoint that never
# answers fails here rather than after the whole budget. Default 10.
# llm_connect_timeout_secs = 10
#
# When an in-flight invocation counts as STUCK (#37). Normally there is
# nothing to set here: the threshold is DERIVED from the deadlines above
# and the [tools] ceiling below, as
#
#   2 x (llm_retry.timeout_max_attempts x llm_timeout_secs
#        + tools.max_timeout_secs
#        + 5s backstop grace)
#
# — twice the longest a single reducer step can legitimately take. At
# the defaults that is 4210s, a little over an hour. Retune any deadline
# and the safety net under it moves with it, which is the whole point of
# deriving it. `fq doctor` and `fq status` print the number this daemon
# arrived at, and the control plane emits `invocation.stuck` for
# anything past it (once per stall, not once per sweep).
#
# This key replaces that derivation outright. It is an emergency escape
# hatch for an operator staring at a live wedge, not a tuning knob: a
# workload that needs it permanently is telling you the deadlines are
# wrong, and those are what should move. Unset by default.
# stuck_threshold_override_secs = 4210
#
# Worker-side knobs for the archive hand-off retry sweeper. The
# sweeper republishes `invocation.archived` for any terminal row
# whose control-plane ack hasn't arrived yet.
#
# How often the sweeper republishes pending rows, in ms. Lower
# values shorten time-to-recovery after a control-plane restart
# at the cost of more NATS traffic during sustained outages.
# archive_retry_interval_ms = 10000
#
# How long after `terminal_at` (in ms) the sweeper logs one
# warning per held row. The sweeper *keeps republishing* past
# this point — the warn is the operator-visible signal that the
# control-plane isn't acknowledging in a reasonable time. The
# local row is never deleted automatically (correctness over
# cleanup); operator action is required for held rows.
# archive_warn_after_ms = 60000

# Retry policy for transient model-call failures: a 429, a 5xx, a
# connection failure, a timeout. Retrying is safe — a model call has no
# side effect — and a retry does not consume an iteration. A 4xx other
# than 429 is never retried: the provider has rejected the request, and
# the same bytes would be rejected again.
[worker.llm_retry]
# Total attempts including the first, for every transient failure except
# a timeout; 1 disables retry. Default 4.
# max_attempts = 4
#
# Total attempts including the first for a call that times out; 1
# disables retrying timeouts. Separate and smaller, because each attempt
# at a hung provider costs the whole llm_timeout_secs: the general cap
# would turn one hang into four. Default 2.
# timeout_max_attempts = 2
#
# Delay before the first retry, in ms, doubling each attempt, with full
# jitter so a fleet does not retry in lockstep. Default 500.
# base_delay_ms = 500
#
# Cap on any single backoff delay, in ms. Default 30000.
# max_delay_ms = 30000
#
# The longest `Retry-After` a rate-limited call is waited out in place,
# in ms. A 429 that names a shorter wait is retried after at least that
# long (plus the jitter above); one that asks for more is not waited for:
# the invocation is DEFERRED — put down at its step boundary with its WAL
# row in flight, `invocation.deferred` published, no `failed` — and
# resumed after the wait (#278). This is also the longest pause the
# throttle below escalates to on its own. Default 120000.
# max_retry_after_ms = 120000

# The per-model provider throttle (#278): one shared state per model the
# fleet talks to, so N concurrent invocations on one model do not hit a
# rate limit in lockstep and burn every retry budget on the same wall.
# A 429 PAUSES the model — for the `Retry-After` the provider named, or
# for an escalating default when it named none — and HALVES the model's
# in-flight cap; every call on the model waits for the pause, and the
# dispatcher HOLDS triggers for agents on a paused model rather than
# starting them (kept alive un-acked, so no redelivery and no trigger
# retry is consumed). Ten consecutive clean calls earn one permit back,
# up to max_concurrent_invocations. `fq status` and `fq doctor` list the
# throttled models; the design is
# docs/design/committed/provider-throttle-and-deferral.md.
[worker.throttle]
# Off makes the throttle inert: every permit is granted at once, no pause
# is set, no trigger is held. The deferral above is not part of the
# throttle and stays on. Default true.
# enabled = true
#
# The pause a 429 without `Retry-After` sets, in ms. Doubles per
# consecutive 429 wave (30s, 60s, 120s, ...) up to
# llm_retry.max_retry_after_ms, and resets on a success. A provider's own
# `Retry-After` is honoured as given, not capped by this. Default 30000.
# default_pause_ms = 30000
#
# How many consecutive successes, with no 429 between them, earn the
# model one more in-flight permit. The cap never exceeds
# max_concurrent_invocations and never drops below 1. Default 10.
# success_window = 10

[tools]
# The deadline on every tool call — built-in and MCP alike — applied at
# the one place all of them pass through. Without it, a tool that never
# returns (an MCP server that accepts a request and never answers) holds
# the invocation for as long as the daemon lives.
#
# The deadline for a tool that manages none of its own. Default 120: a
# tool call is a single bounded action, and two minutes is already
# generous for one. The tool that legitimately needs longer is `exec`,
# which asks for its own below.
# default_timeout_secs = 120
#
# The ceiling on any single call, whatever the tool asked for. Default
# 900. This may not be set BELOW `[tools.exec] max_timeout_secs` — the
# daemon refuses to start if it is, because a lower general ceiling
# would cap every exec call while the exec section still read the
# higher number. Nor may either section's default_timeout_secs exceed
# its own max_timeout_secs.
# max_timeout_secs = 900
#
# Note on elapsed time: the deadline above is what a tool is told and
# what the timeout message quotes, but the runtime's own backstop timer
# fires FIVE SECONDS LATER, so a tool that ignores its deadline is cut
# off at deadline + 5s. The grace exists because every co-operative
# tool starts its clock after the host starts its, and an equal timer
# would always replace the tool's own (more useful) answer with a bare
# "timed out".
#
# How many tool calls may time out in a row before the invocation itself
# fails. Default 3; 0 disables the limit entirely and lets an agent keep
# trying against a dead tool for as long as its budget lasts. One
# timeout reaches the model as a tool error it can route around; a run
# of them means nothing is answering, and without this an agent spends
# its whole budget one deadline at a time. Any call that returns —
# success, or a tool-reported error — clears the count. `exec` timing
# ITSELF out counts too: it is the tool most able to hang for minutes
# at a time, so exempting it would exempt the case that matters.
# max_consecutive_timeouts = 3

[tools.exec]
# Timeouts for the built-in `exec` tool. Raise these for agents that run
# long builds/test suites (e.g. a full `just ci`); a call that exceeds
# the timeout has its whole process group killed — the command and
# everything it started — and is returned as an error with partial
# output. `exec` is the one built-in that times itself, so these win
# over `[tools] default_timeout_secs` — up to `[tools] max_timeout_secs`.
#
# Timeout applied when a call doesn't set its own `timeout_secs`. Default 120.
# default_timeout_secs = 120
#
# Hard ceiling on any single call. A caller-supplied `timeout_secs` above
# this is clamped down (not rejected). Default 600.
# max_timeout_secs = 600
#
# How long a timed-out process group gets to exit on SIGTERM before it is
# SIGKILLed. Default 2. Raise it for commands that need to flush on their
# way out; the window ends early once the group is gone, so it costs
# nothing when nothing is ignoring SIGTERM.
# kill_grace_secs = 2
#
# How long output capture continues after the child is gone. Default 2.
# Bounds the drain so a descendant that inherited the pipe and left the
# process group (`setsid`) cannot hold the call open.
# drain_grace_secs = 2
#
# These two run back to back AFTER the deadline, and the host cancels a
# call 5s after that same deadline, so their sum must stay strictly under
# 5 — the daemon refuses to start otherwise, rather than let the host cut
# a teardown short and leave the process group alive.

[mcp]
# What an MCP server is allowed to cost the daemon. Without these, one
# server that accepts a connection and never answers held `fqd` at
# startup with every agent down, and one that returned a `next_cursor`
# for ever spun tool discovery with no bound on memory.
#
# Shared servers start CONCURRENTLY, so boot waits for the slowest of
# them rather than the sum. A server that fails or times out is marked
# unavailable and boot carries on: its tools are absent, every agent
# that declares it is refused at dispatch with a terminal failure
# naming it, and `fq doctor` reports it with the reason and the next
# retry. Agents that do not declare it are unaffected.
#
# How long the `initialize` handshake may take, in seconds. Default 30.
# Raise it for a remote server behind a cold serverless endpoint; lower
# it for locally-installed stdio servers, which answer in milliseconds.
# startup_timeout_secs = 30
#
# How long discovering a server's tools may take, in seconds — the
# whole walk across every page of `tools/list`, not one request.
# Default 30.
# discovery_timeout_secs = 30
#
# The most `tools/list` pages one discovery may follow. Default 100. A
# server that keeps returning a `next_cursor` — by design, or through a
# cursor bug that never advances — is cut off here and marked
# unavailable.
# max_discovery_pages = 100
#
# The most tools one server may advertise, counted across pages.
# Default 1000. Every tool becomes a schema in every prompt the agents
# using that server send, so a runaway list costs tokens on every turn
# as well as memory.
# max_tools = 1000
#
# The longest line the stdio transport will read from a server before
# refusing the connection, in bytes. Default 1048576 (1 MiB). One
# JSON-RPC message is one line, so this bounds what a single message
# can make the daemon buffer.
# max_line_bytes = 1048576
#
# How long to wait before the first retry of an unavailable server, in
# seconds, doubling per attempt. Default 30. A server that comes up
# later — its package finished installing, its host finished rebooting
# — is picked up without `fq reload`. Set to 0 to disable retrying,
# which is the only way to ask for "unavailable until restart".
# retry_initial_secs = 30
#
# The ceiling the doubling saturates at, in seconds. Default 600, so a
# server that is down for an afternoon is dialled once every ten
# minutes rather than twice a minute.
# retry_max_secs = 600

[edge]
# The authenticated operator surface — every `fq` verb speaks it, so a
# daemon without one can be neither inspected nor stopped except by a
# signal. There is no way to switch it off, and the bound listener
# doubles as the daemon's single-instance lock: it is taken before
# anything else happens, so a second daemon on the same address exits at
# once, naming it, having registered no worker and published nothing.
#
# Bind address for the TLS listener. Default 127.0.0.1:9472. Note the
# dashboard's own default is the same port — move one of them if you run
# both on one host.
# bind = "127.0.0.1:9472"
#
# How long a `min_seq`-gated read waits for the projection to catch up
# before answering `Lagging`, in ms. Default 2000.
# min_seq_wait_ms = 2000
#
# The connection budget. These bound what a peer that has not
# authenticated can make the daemon allocate — an fd and a task per
# connection, a rustls session per handshake — and what one client that
# has can queue. Raise them for a busy dashboard or many operators;
# there is rarely a reason to lower them.
#
# Connections held at once, authenticated or not. Past this the accept
# loop stops taking sockets off the backlog. Default 256.
# max_connections = 256
#
# Connections in the pre-auth phase (TLS handshake + token read).
# Tighter than max_connections because a handshake costs CPU where an
# open connection costs a descriptor. Default 64.
# max_pre_auth_connections = 64
#
# In-flight requests per authenticated connection. Default 32.
# max_concurrent_requests = 32
#
# How long the accept loop pauses after a failed `accept`, in ms. Not a
# nicety: tokio does not clear a listener's readiness on EMFILE, so
# retrying immediately would spin a worker thread and starve the very
# tasks holding the descriptors. Default 100.
# accept_error_backoff_ms = 100

[bus]
# How every durable consumer on the event bus handles redelivery when
# its handler fails transiently — a full disk under the projection, a
# store that will not write, a broker that will not take an ack.
#
# None of these durables has a dead-letter path, so none of them has a
# delivery limit: an event dropped to a bound is an event the projection
# skips for good. What keeps a permanent fault from becoming a hot loop
# is the delay below, not a bound.
#
# First NAK delay after a transient failure, in ms; doubles per
# redelivery from there. Default 1000.
# nak_initial_ms = 1000
#
# Ceiling the doubling saturates at, in ms. A handler failing forever
# settles into one retry per this interval. Default 60000.
# nak_max_ms = 60000
#
# How long the server waits for an ack before redelivering by itself,
# in ms. Size it so a healthy handler never trips it — the projection,
# coordination and heartbeat handlers are single SQLite writes.
# Default 30000.
#
# Two durables do not take this value, both deliberately. The
# summariser calls a model inline, so its window is `[worker]
# llm_timeout_secs` plus this one — otherwise a slow summary is
# redelivered behind the one still generating it and paid for twice.
# And the trigger consumer carries a retry backoff schedule, which
# JetStream uses to *replace* a consumer's ack window with the
# schedule's first entry.
# ack_wait_ms = 30000
#
# Floor on the gap between two error lines about one consumer's
# redeliveries, once the delay has stopped escalating, in ms. Every
# escalation step is logged regardless — each one is new information
# about how bad the fault is. Default 60000.
# log_interval_ms = 60000
#
# Redeliveries past which `control.status` and `fq doctor` report a
# consumer as stuck rather than merely retrying, and name it. Five is
# about thirty seconds of continuous failure at the default escalation.
# Default 5.
# stuck_after_redeliveries = 5
