# factor-q client configuration — read by `fq`, and by nothing else.
#
# The daemon, `fqd`, reads the file beside this one: `fqd.toml`. That
# is where the broker URL, the agents directory, the model registry and
# every other runtime knob live. Nothing there is read by `fq`, and
# nothing here is read by `fqd`.
#
# There is exactly one setting, and a fresh project needs none of it.
# `fq connect` writes the pairing store — every daemon this client can
# reach, and the token to authenticate to each — so the only question
# left for this file is *which* of them to talk to, and with a single
# pairing even that is answered. Credentials stay in the pairing store:
# a token rotates on the daemon's schedule, not an operator's, and
# merging the two would either make this file secret or stop the
# secrets being private.
#
# Full documentation: https://github.com/bricef/factor-q

# [daemon]
# Edge address `fq` talks to when `--addr` is absent and more than one
# daemon is paired. Names a pairing rather than carrying credentials,
# so rotating a token never touches this file.
# addr = "127.0.0.1:9472"
