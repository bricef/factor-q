[package]
name = "fq-cli"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "fq_cli"
path = "src/lib.rs"

[[bin]]
name = "fq"
path = "src/bin/fq.rs"


# cargo-binstall: fetch the pre-built `fq` binary from GitHub Releases
# instead of compiling. Must match the release artifact naming (see
# scripts/package.sh and .github/workflows/release.yml).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/factor-q-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "fq"

[dependencies]
# edge: the daemon hosts the authenticated operator edge (ADR-0006 +
# ADR-0031); whether the listener starts is `[edge]` in fq.toml. The
# client half (`fq connect` / `fq ops` / `fq token`) speaks it too.
fq-edge = { path = "../fq-edge" }
fq-ops = { workspace = true }
fq-runtime = { workspace = true }
fq-tools = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tarpc = { workspace = true }
# "full" is deliberate: this is the daemon/CLI binary crate, not a
# library — no consumer inherits the feature set (#194 phase 2).
tokio = { workspace = true, features = ["full"] }
# connections.toml — the client-side credential store (`fq connect`).
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Everything a broker, a mock model or a spawned daemon needed left
# with the daemon: what the client tests still exercise is argument
# parsing, rendering, and a signal disposition.
libc = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
