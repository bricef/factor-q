name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # paths-filter reads the PR's changed-file list

# Every build job drives its checks through a `just` target, so CI stays
# isomorphic with the local dev workflow. Setup steps (toolchains) are the
# only non-just glue.
#
# `changes` path-filters so the expensive Rust and Go builds run their
# steps only when their code (or the build recipe / this workflow) actually
# changes — a docs-only change skips them. The build jobs still *run* and
# still report their required status check (they just do nothing when there
# is nothing to build), so branch protection is never left waiting on a
# check that never arrives — the reason we gate steps, not the whole job.
#
# Linting is one job, not a phase of each suite: `quality` ("Code quality")
# runs every non-test gate — the include! scan, the size ratchets, fmt, and
# clippy over every crate — so one command answers whether the tree is clean.
# The per-suite jobs below keep doc/build/test. `audit` ("Dependency audit")
# is the supply-chain gate — `just audit`, cargo audit + cargo deny against
# deny.toml — and, like `quality`, is never path-filtered.
#
# The Rust gate is independent per-suite jobs over the single workspace
# (#194) — `runtime-ci` (installs the pinned nats-server the per-test brokers
# use, plus Node for the MCP integration tests), `store-ci` (its grant-bus
# test spawns private brokers likewise), and `dashboard-ci` (hermetic) — so a
# red in one never masks another's results (#38). Each is triggered by its own
# `changes` path filter (`runtime`/`store`/`dashboard`), so a store-only PR no
# longer rebuilds the runtime suite (or spins up NATS/Node), and vice versa.
# The shared root Cargo.toml/Cargo.lock conservatively trigger every suite.
# `rust-ci` is a thin aggregate that fails iff any half fails; it keeps the
# "Rust CI" required-status-check name, so the split needs no
# branch-protection edit.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      store: ${{ steps.filter.outputs.store }}
      go: ${{ steps.filter.outputs.go }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      coupling: ${{ steps.filter.outputs.coupling }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Per-suite Rust filters (#51) so each build job triggers only on
            # its own changes. The shared entries — the top-level justfile, the
            # toolchain pin, and any workflow edit — conservatively trigger every
            # suite. fq-dashboard path-depends on fq-runtime, so dashboard-ci
            # gates on `runtime || dashboard` (see its `if:` below) rather than
            # getting a fourth filter that would duplicate the `runtime` globs.
            runtime:
              - 'services/fq-runtime/**'
              # The shared test-only crate is a dev-dependency of the runtime
              # crates (#233); its gate runs in this job.
              - 'services/fq-test-support/**'
              # The workspace root: a manifest or lock change re-resolves
              # every suite (#194).
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'rust-toolchain.toml'
              - '.nats-version'
              - '.nats-checksums'
              - '.github/workflows/**'
            store:
              - 'services/fq-store/**'
              # grant_bus dev-depends on the shared broker guard and the
              # pinned nats-server it spawns (#233).
              - 'services/fq-test-support/**'
              # The workspace root re-resolves every suite (#194).
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'rust-toolchain.toml'
              - '.nats-version'
              - '.nats-checksums'
              - '.github/workflows/**'
            go:
              - 'adapters/**'
              - 'justfile'
              - '.github/workflows/**'
            # Any Rust the module graph is built from — deliberately broader
            # than the per-suite filters, which miss `tools/` entirely, and
            # narrower than "always", so a docs-only PR gets no comment.
            coupling:
              - 'services/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/coupling-comment.py'
              - 'scripts/coupling-pr-comment.sh'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'services/fq-dashboard/**'
              - 'scripts/dashboard-screenshots.sh'
              - 'scripts/dashboard-pr-comment.sh'
              - '.github/workflows/ci.yml'
            # Deliberately narrow. The image build is the slowest job here,
            # and only two kinds of change can break it: the Dockerfile
            # itself, and the workspace's membership or dependency graph.
            # The failure this exists to catch is a new crate that never
            # reached the Dockerfile's member-manifest COPY list — cargo
            # refuses to load a workspace with a member manifest missing,
            # so the build dies on its first cargo line. That is a
            # `Cargo.toml` change every time.
            docker:
              - 'services/fq-runtime/Dockerfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  docs-lint:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # markdownlint runs via npx inside `just lint-docs`; setup-node
      # provides npx (a Rust container / minimal runner has none).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: extractions/setup-just@v4
      - run: just lint-docs
      # Relative-link integrity across all repo markdown (stdlib Python,
      # preinstalled on the runner).
      - run: just check-links

  # Every non-test quality gate, in one job, behind one just target: the
  # include! source scan, the file and function size ratchets, workspace
  # formatting, and clippy over every crate. fmt and clippy used to be phases inside
  # runtime-ci/store-ci/dashboard-ci, which meant no single command answered
  # "is this branch clean?" without also running the test suites; consolidating
  # them here also compiles the workspace for clippy once rather than per suite.
  #
  # Needs neither NATS nor Node — nothing here runs a test that wants a broker.
  #
  # Deliberately NOT path-filtered. It is the job that says whether the tree is
  # clean, and a size baseline can be edited without touching any .rs file,
  # so a filter keyed on Rust sources would let a budget edit through ungated.
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
      # Keep the version ref in lockstep with rust-toolchain.toml — the
      # size ratchets parse Rust with syn (tools/fq-lint), and clippy
      # runs here, so this job needs the pinned toolchain.
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: just quality

  # The dependency gate (#406): `cargo audit` over the flat lockfile and
  # `cargo deny check` over the resolved graph, behind `just audit` — the
  # same command a developer runs. deny.toml is the reviewed baseline: one
  # explained line per accepted finding, never a blanket allow.
  #
  # Deliberately NOT path-filtered. Advisories arrive without a commit, so
  # the job that says "the lockfile is clean" has to run on every push and
  # PR whatever changed — a docs-only PR can be the first to meet a new
  # RUSTSEC id. Neither tool compiles the workspace (audit reads Cargo.lock,
  # deny runs `cargo metadata`), so there is no rust-cache here; the pinned
  # toolchain is only for `cargo` itself.
  #
  # The tools are prebuilt binaries at exactly the versions the justfile
  # pins — read back with `just --evaluate`, so there is one place to bump
  # — fetched by install-action, which verifies their checksums. The action
  # is pinned to a full commit rather than a tag (production-readiness
  # review, finding E2); Dependabot keeps the SHA and the version comment
  # moving together.
  #
  # Enforcement: this job's result is an input to the `rust-ci` aggregator
  # below, so a red audit turns the required "Rust CI" context red.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
      # Keep in lockstep with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.120.0
      - id: versions
        run: >-
          echo "tools=cargo-audit@$(just --evaluate cargo_audit_version),cargo-deny@$(just --evaluate cargo_deny_version)"
          >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: ${{ steps.versions.outputs.tools }}
      - run: just audit

  runtime-ci:
    name: Runtime CI
    needs: changes
    runs-on: ubuntu-latest
    # sccache: a per-compilation-unit compiler cache over GitHub's Actions
    # cache backend, layered on top of rust-cache's whole-target/ cache.
    # HONEST CAVEAT (#51 Deliverable 6): this OVERLAPS rust-cache, which
    # already restores target/ — sccache's marginal value on CI is only
    # visible from this PR's own run (see `sccache --show-stats` at each
    # job's end). Keep it only if those numbers beat rust-cache alone; it
    # is isolated in one revertible commit. CARGO_INCREMENTAL=0 is required
    # (incremental compilation bypasses RUSTC_WRAPPER); rust-cache sets it
    # too, repeated here so the wiring is self-contained.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - if: needs.changes.outputs.runtime != 'true'
        run: echo "No runtime-relevant changes — skipping the runtime build."
      - if: needs.changes.outputs.runtime == 'true'
        uses: actions/checkout@v4
      # Keep the version ref in lockstep with rust-toolchain.toml (#102) —
      # rustup enforces the pin either way; matching here avoids installing
      # a second, unused toolchain.
      - if: needs.changes.outputs.runtime == 'true'
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      # Caches the unified workspace target/ at the repo root (#194) —
      # rust-cache's default workspace.
      - if: needs.changes.outputs.runtime == 'true'
        uses: Swatinem/rust-cache@v2
      # Installs sccache and points it at the GHA cache (reads SCCACHE_GHA_*).
      - if: needs.changes.outputs.runtime == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
      # The MCP integration tests spawn the reference server via npx.
      - if: needs.changes.outputs.runtime == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - if: needs.changes.outputs.runtime == 'true'
        uses: extractions/setup-just@v4
      # Install the pinned test broker (#233): tests that spawn their own
      # nats-server need the binary. Idempotent; version from .nats-version.
      - if: needs.changes.outputs.runtime == 'true'
        run: just install-nats
      - if: needs.changes.outputs.runtime == 'true'
        run: just runtime-ci
      # The shared test-only crate's own gate (#233) — the runtime gate only
      # compiles it as a dep. Uses the nats-server installed above.
      - if: needs.changes.outputs.runtime == 'true'
        run: just test-support-ci
      # Cache hit-rate for the keep/drop decision on sccache (see env note).
      - if: always() && needs.changes.outputs.runtime == 'true'
        run: sccache --show-stats

  store-ci:
    name: Store CI
    needs: changes
    runs-on: ubuntu-latest
    # sccache over the GHA backend — see the caveat on runtime-ci.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - if: needs.changes.outputs.store != 'true'
        run: echo "No store-relevant changes — skipping the store build."
      - if: needs.changes.outputs.store == 'true'
        uses: actions/checkout@v4
      # Same lockstep note as runtime-ci: match rust-toolchain.toml.
      - if: needs.changes.outputs.store == 'true'
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      # Unified workspace at the repo root (#194) — rust-cache's default.
      - if: needs.changes.outputs.store == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.store == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
      - if: needs.changes.outputs.store == 'true'
        uses: extractions/setup-just@v4
      # No Node toolchain needed. The grant-bus test spawns its own private
      # broker (#233); `just store-ci` provisions the pinned nats-server via
      # its `install-nats` dependency.
      - if: needs.changes.outputs.store == 'true'
        run: just store-ci
      # Cache hit-rate for the keep/drop decision on sccache.
      - if: always() && needs.changes.outputs.store == 'true'
        run: sccache --show-stats

  # Aggregate gate: keeps the "Rust CI" required-status-check name so the
  # runtime/store split needs no branch-protection change. Green iff every
  # input is green; the Actions UI still shows which one failed.
  #
  # The dependency audit is an input too. A red audit has to block a merge,
  # and "Rust CI" is a required context today while "Dependency audit" is
  # not — without this edge the audit job would go red and nothing would
  # stop the merge. Making "Dependency audit" required in its own right is
  # a repo-settings change for the maintainer; until then this is the
  # enforcement, and afterwards it is belt and braces.
  rust-ci:
    name: Rust CI
    needs: [runtime-ci, store-ci, dashboard-ci, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "runtime-ci:   ${{ needs.runtime-ci.result }}"
          echo "store-ci:     ${{ needs.store-ci.result }}"
          echo "dashboard-ci: ${{ needs.dashboard-ci.result }}"
          echo "audit:        ${{ needs.audit.result }}"
          if [ "${{ needs.runtime-ci.result }}" != "success" ] || [ "${{ needs.store-ci.result }}" != "success" ] || [ "${{ needs.dashboard-ci.result }}" != "success" ] || [ "${{ needs.audit.result }}" != "success" ]; then
            echo "::error::a Rust suite or the dependency audit failed — see the Runtime CI / Store CI / Dashboard CI / Dependency audit jobs above"
            exit 1
          fi

  dashboard-ci:
    name: Dashboard CI
    needs: changes
    runs-on: ubuntu-latest
    # fq-dashboard path-depends on fq-runtime (services/fq-dashboard/Cargo.toml),
    # so this job builds when EITHER changes — hence the `runtime || dashboard`
    # gate on every step (rather than a dedicated filter that would duplicate
    # the `runtime` globs). A pure fq-store change skips it.
    # sccache over the GHA backend — see the caveat on runtime-ci.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - if: needs.changes.outputs.runtime != 'true' && needs.changes.outputs.dashboard != 'true'
        run: echo "No dashboard-relevant changes — skipping the dashboard build."
      - if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.dashboard == 'true'
        uses: actions/checkout@v4
      # Keep in lockstep with rust-toolchain.toml (#102).
      - if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.dashboard == 'true'
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      # Unified workspace at the repo root (#194) — rust-cache's default.
      - if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.dashboard == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.dashboard == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
      - if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.dashboard == 'true'
        uses: extractions/setup-just@v4
      # Hermetic — the router tests spin their own read service over a
      # temp DB; no broker, no Node.
      - if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.dashboard == 'true'
        run: just dashboard-ci
      # Cache hit-rate for the keep/drop decision on sccache.
      - if: always() && (needs.changes.outputs.runtime == 'true' || needs.changes.outputs.dashboard == 'true')
        run: sccache --show-stats

  # Visual artifact, not a required check: when dashboard code changes,
  # render every page from deterministic fixtures and screenshot them
  # (headless chrome over file:// — no daemon, no broker), so the PR run
  # carries reviewable images of what the dashboard now looks like —
  # both as a run artifact and as a self-renewing gallery comment on
  # the PR (images hosted on the ci/dashboard-screenshots blob branch).
  dashboard-screenshots:
    name: Dashboard screenshots
    needs: changes
    runs-on: ubuntu-latest
    # Elevated for this job only: push the ci/dashboard-screenshots
    # branch + upsert the PR gallery comment. The workflow default
    # stays read-only.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - if: needs.changes.outputs.dashboard != 'true'
        run: echo "No dashboard changes — skipping screenshots."
      - if: needs.changes.outputs.dashboard == 'true'
        uses: actions/checkout@v4
      # Keep in lockstep with rust-toolchain.toml (#102).
      - if: needs.changes.outputs.dashboard == 'true'
        uses: dtolnay/rust-toolchain@1.120.0
      # Unified workspace at the repo root (#194) — rust-cache's default.
      - if: needs.changes.outputs.dashboard == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.dashboard == 'true'
        uses: extractions/setup-just@v4
      # ubuntu-latest ships google-chrome; the script resolves it.
      - if: needs.changes.outputs.dashboard == 'true'
        run: just dashboard-screenshots
      - if: needs.changes.outputs.dashboard == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-screenshots
          path: dist/dashboard-screenshots/*.png
          if-no-files-found: error
      # The gallery comment: PR context only, and only for same-repo
      # branches (a fork PR's token is read-only anyway).
      - if: >-
          needs.changes.outputs.dashboard == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          bash scripts/dashboard-pr-comment.sh dist/dashboard-screenshots
          "${{ github.event.pull_request.number }}"
          "${{ github.event.pull_request.head.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # Advisory artifact, not a required check: report what a PR does to module
  # coupling, as a self-renewing comment on the PR. The counterweight to the
  # size ratchets — a file-size budget alone rewards splitting a god-file into
  # two halves that import each other, and this is what makes that visible.
  # Reporting first, deliberately: gates and verification come later
  # (docs/reviews/2026-07-27-code-quality-metrics.md).
  coupling-metrics:
    name: Coupling metrics
    needs: changes
    runs-on: ubuntu-latest
    # PR context only — the comment needs somewhere to go, and the diff needs
    # a merge base. Fork PRs get a read-only token, so the upsert would fail;
    # the script exits 0 either way, but there is no point spending the build.
    if: >-
      needs.changes.outputs.coupling == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Elevated for this job only: upsert the PR comment. The workflow default
    # stays read-only.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the script resolves the merge base and materialises
          # it as a worktree. The default depth-1 checkout has neither.
          fetch-depth: 0
      # Keep in lockstep with rust-toolchain.toml — fq-lint parses Rust with syn.
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - run: >-
          bash scripts/coupling-pr-comment.sh
          "${{ github.event.pull_request.number }}"
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}

  go-ci:
    name: Go adapters
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.go != 'true'
        run: echo "No Go-relevant changes — skipping the build."
      - if: needs.changes.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: adapters/github-watcher/go.mod
      - if: needs.changes.outputs.go == 'true'
        uses: extractions/setup-just@v4
      - if: needs.changes.outputs.go == 'true'
        run: just go-ci

  # The container image, which had been unbuildable for weeks before this
  # job existed: `fq-agent` and `fq-daemon` were added to the workspace and
  # never reached the Dockerfile's member-manifest COPY list, so `cargo
  # build` failed on its first line inside the image. Nothing noticed,
  # because `just docker-build` ran in no workflow — the image was the one
  # deliverable with no gate at all.
  #
  # It builds the real image rather than linting the Dockerfile: the failure
  # mode is a manifest cargo cannot resolve, which only a build finds. The
  # smoke check afterwards is cheap and catches the other half — an image
  # that builds but cannot start, which is what `CMD ["run"]` left behind
  # when the split deleted that subcommand.
  #
  # Path-filtered narrowly (see the `docker` filter): this is the slowest
  # job in the file, and a docs-only or single-crate PR cannot break it.
  docker:
    name: Container image
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.docker != 'true'
        run: echo "No Docker-relevant changes — skipping the image build."
      - if: needs.changes.outputs.docker == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.docker == 'true'
        uses: extractions/setup-just@v4
      # No layer cache: this is a cold build every time, and it compiles
      # the workspace from scratch inside the image. That is affordable
      # precisely because the filter above is narrow — and a cold build
      # is also the honest test, since the failure being guarded against
      # is a manifest cargo cannot resolve, which a warm cache could
      # step straight over.
      - if: needs.changes.outputs.docker == 'true'
        run: just docker-build
      # An image that builds but cannot run is still broken, and that is
      # not hypothetical: the entrypoint invoked a deleted subcommand and
      # the build was perfectly happy. `fqd --version` proves the
      # entrypoint resolves and the binary executes in the runtime stage,
      # which is distroless and has no shell to check it any other way.
      - if: needs.changes.outputs.docker == 'true'
        run: |
          set -euo pipefail
          echo "entrypoint (the daemon):"
          docker run --rm factor-q/fq-runtime:latest --version
          echo "the client, which ships alongside it:"
          docker run --rm --entrypoint /usr/local/bin/fq \
            factor-q/fq-runtime:latest --version
