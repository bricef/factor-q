name: Live suites

# The two suites that drive a real daemon against a real model: `just
# smoke` (six end-to-end trigger/tool/projection cases) and `just drill`
# (fifteen durability checks over drain, recovery, SIGTERM and SIGKILL).
#
# They existed for months with nothing running them, and both were broken
# by the fq/fqd binary split for weeks before anyone found out — the
# daemon was renamed and they still invoked `fq run`. That is the gap
# this workflow closes: not "are they written", but "does anyone run
# them".
#
# NOT on pull_request, deliberately. Every run spends real money on the
# Anthropic API — roughly $0.01 for smoke, plus the drill's twelve short
# invocations — and it is per run, not per repository. Putting that on
# every push would bill for typo fixes and would invite the usual
# response to a slow paid check, which is to stop reading it. Nightly
# catches a break within a day of the merge that caused it, and
# `workflow_dispatch` is there for the change you already suspect.
#
# Both suites in ONE job, in sequence. They share the dev broker on
# 4222, and a daemon holds the `fq-dispatcher` durable consumer: two
# runs at once would ack each other's triggers, find no such agent, and
# discard them. The failure looks exactly like a product bug.
#
# The reasoning matrix is a SEPARATE job, and may run alongside: it
# brings its own broker on 14222 and a scratch daemon, so it cannot touch
# the shared consumer. It spends about $0.07 a run, most of it on
# claude-opus-5 directly — the one arm that proves a signed thinking
# block survives a tool turn, which no OpenRouter model can stand in for
# (#603). A fourth arm, native Gemini, runs when AISTUDIO_API_KEY is set
# and is announced as off when it is not.

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose — the top of the hour is the
    # busiest slot on shared runners.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Queue, never cancel. A cancelled run leaves a daemon holding the
# shared durable consumer, which breaks the *next* run rather than this
# one — the hardest kind of failure to attribute.
concurrency:
  group: live-suites
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: Smoke and drill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Fail here rather than fifteen minutes in, with the fix in the
      # message. A live suite without a key is not a skip: it is this
      # workflow silently going back to being the thing that does not
      # run, which is what it exists to fix.
      #
      # OpenRouter, because that is the provider the suites default to
      # (`SMOKE_API_KEY_ENV` / `DRILL_API_KEY_ENV`). This workflow
      # supplies a key; the suites choose the provider. If that default
      # moves, this name moves with it.
      - name: Check the API key is configured
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY is not set for this repository. \
          Add it under Settings -> Secrets and variables -> Actions. \
          Both suites call a real model API and cannot run without it."
            exit 1
          fi
          echo "key present (${#OPENROUTER_API_KEY} chars)"

      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4

      # The dev broker on 4222, which both suites dial through the
      # justfile's FQ_NATS_URL and FQ_NATS_TOKEN defaults (the token
      # never rides in the URL, #540). This is the shared instance from
      # infrastructure/docker-compose.yml, not the per-test private
      # broker the unit suites spawn.
      - name: Start NATS
        id: infra
        run: just infra-up

      - name: Smoke suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: just smoke

      # Runs even if smoke failed: they cover different things, and one
      # red should not hide the other's result — the same reason the Rust
      # suites are separate jobs.
      #
      # Gated on the setup having happened, though, which bare `always()`
      # is not. On the first dispatch the key check failed, and the drill
      # ran anyway on a runner with no toolchain: `just: command not
      # found`, a second red that said nothing and buried the first.
      # "Even if smoke failed" is not the same claim as "even if nothing
      # is installed".
      - name: Drain drill
        if: always() && steps.infra.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: just drill

      # A daemon that outlives its suite holds the durable consumer and
      # breaks the next run. The runner is ephemeral so this is belt and
      # braces, but the same reap is the local habit and the failure it
      # prevents is a silent one.
      #
      # Bare `always()` is right here and not above: every command below
      # tolerates a runner where setup never ran — `pgrep` finds nothing
      # and the `just` call is swallowed — so it cannot invent a failure
      # the way the drill step did.
      - name: Reap stray daemons
        if: always()
        run: |
          for pid in $(pgrep -x fqd || true); do
            echo "stray daemon $pid — stopping"
            kill -INT "$pid" || true
          done
          just infra-down || true

  reasoning-matrix:
    name: Reasoning round-trip matrix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Same doctrine as above: a missing key fails here, with the fix in
      # the message, rather than becoming a suite that quietly never runs.
      # Two keys, because the matrix drives Anthropic directly and two
      # models through OpenRouter.
      - name: Check the API keys are configured
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AISTUDIO_API_KEY: ${{ secrets.AISTUDIO_API_KEY }}
        run: |
          missing=""
          [ -n "${OPENROUTER_API_KEY}" ] || missing="$missing OPENROUTER_API_KEY"
          [ -n "${ANTHROPIC_API_KEY}" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::not set for this repository:$missing. \
          Add them under Settings -> Secrets and variables -> Actions. \
          The matrix calls claude-opus-5 and two OpenRouter models and cannot run without both."
            exit 1
          fi
          echo "keys present"
          # Optional, and visibly so: the Gemini arm is the one live proof
          # of the thought-signature path, and a run without it must read
          # as three arms, not four.
          if [ -z "${AISTUDIO_API_KEY}" ]; then
            echo "::warning::AISTUDIO_API_KEY is not set — the Gemini arm is off (three arms run). \
          Add a Google AI Studio key under Settings -> Secrets and variables -> Actions to run four."
          fi
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      # The harness runs the debug binaries and the pinned broker the
      # unit suites use; nothing from infra/ or the compose stack.
      - name: Build the runtime and install the pinned broker
        run: |
          just build-runtime
          just install-nats
      # Three arms, one task each, then verify-carry.py judges the event
      # log: every arm completed, every assistant turn replayed verbatim
      # into the next request, the reasoning arms carried a reasoning
      # part, the control carried none. That verdict is the exit status.
      - name: Live matrix
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AISTUDIO_API_KEY: ${{ secrets.AISTUDIO_API_KEY }}
          OUT: ${{ runner.temp }}/reasoning-matrix
        run: bash experiments/reasoning-round-trip/harness/live-matrix.sh
      # The evidence a red run needs: transcripts, the event log, costs,
      # the daemon log. Kept for two weeks, which outlives the next run
      # that would either confirm or clear it.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-matrix-${{ github.run_id }}
          path: ${{ runner.temp }}/reasoning-matrix
          if-no-files-found: ignore
          retention-days: 14
      # The harness stops its own daemon and broker on exit; this is for
      # the run that was killed by the job timeout instead.
      - name: Reap stray processes
        if: always()
        run: |
          for pid in $(pgrep -x fqd || true); do
            echo "stray daemon $pid — stopping"
            kill -INT "$pid" || true
          done
          for pid in $(pgrep -x nats-server || true); do
            echo "stray broker $pid — stopping"
            kill -INT "$pid" || true
          done
