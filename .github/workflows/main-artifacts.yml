name: Main artifacts

# Hermetic deploy artifacts (#102, ADR-0035): every merge to main publishes
# two artifact families from ONE build of the static x86_64 musl binaries.
#
#   1. The checksummed, SHA-stamped tarball (fq, fqd, fq-dashboard, fq-cas,
#      github-watcher, fq-cron) to the rolling `main-latest` pre-release —
#      `package-main` / `publish-main` in the root justfile. The
#      binary-only channel for hosts that are not containerised; it holds
#      only the newest build.
#   2. The container images (fq-runtime, fq-dogfood, github-watcher,
#      fq-cron, fq-dashboard) to ghcr.io/bricef, tagged with the
#      twelve-hex commit the binaries inside them report and with the
#      moving `main-latest` — `docker-build` / `docker-check` /
#      `docker-publish`. This is what the dogfood host deploys
#      (ops/dogfood/deploy.sh, a tag bump against ops/dogfood/compose.yml)
#      and rolls back to — the registry keeps every commit tag, so it is
#      the deploy history. The images are assembled from the same
#      binaries as the tarball, never compiled in-image, so both families
#      carry the identical binary for a commit (#587).
#
# Like ci.yml/release.yml, every job drives its work through a `just`
# target so the pipeline stays reproducible locally; the registry login is
# the one piece of non-`just` glue, since it must exist before a push can.

on:
  push:
    branches: [main]
  # Manual re-publish (e.g. after a transient failure) — builds whatever
  # main currently points at.
  workflow_dispatch:

# One publisher at a time; a newer merge supersedes an in-flight publish.
concurrency:
  group: main-artifacts
  cancel-in-progress: true

# Needs write access to recreate the main-latest release and its tag, and
# to push the images to the repository's container registry.
permissions:
  contents: write
  packages: write

jobs:
  build-publish:
    name: Build & publish main-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in lockstep with rust-toolchain.toml (#102).
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-musl
      # Unified workspace at the repo root (#194) — rust-cache's default.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: adapters/github-watcher/go.mod
      - uses: extractions/setup-just@v4
      # musl needs its C toolchain for the bundled SQLite.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: just build-release x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - run: just build-watcher x86_64-unknown-linux-musl
      - run: just build-cron x86_64-unknown-linux-musl
      - run: just package-main x86_64-unknown-linux-musl
      - run: just publish-main "${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}
      # The images, from the binaries built above. The tag is the same
      # twelve-hex commit `fq --version` stamps, so `docker-publish` can
      # check the image content against the tag before anything is pushed.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: just docker-build x86_64-unknown-linux-musl "${GITHUB_SHA:0:12}"
      - run: just docker-check "${GITHUB_SHA:0:12}"
      - run: just docker-publish "${GITHUB_SHA:0:12}"
