[package]
name = "fq-lint"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fq-lint"
path = "src/main.rs"

[dependencies]
# The de facto Rust parser (already in the tree via every derive macro).
# `span-locations` is what turns a parsed item back into line numbers; with
# resolver = "2" this feature stays in the normal dependency graph and does
# not leak into the proc-macro graph, so the workspace's derive macros are
# unaffected.
syn = { version = "3", features = ["full", "parsing", "extra-traits", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# `--coupling --json` is consumed by scripts/coupling-pr-comment.sh, which
# diffs two runs of it. Hand-rolled JSON would be fine for today's keys
# (module names are Rust identifiers) and would break the first time a path
# needed escaping.
serde_json = { workspace = true }

[lints]
workspace = true
